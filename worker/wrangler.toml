name = "telegram-gdrive-bot"
main = "index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["0 */6 * * *", "30 18 * * *"]

[vars]
GITHUB_OWNER = "Another-yashu-2"
GITHUB_REPO = "waguri-paglu-mirror-bot"
GITHUB_WORKFLOW = "mirror.yml"
WORKER_URL = "https://telegram-gdrive-bot.yashdaive.workers.dev"

[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "986025f566ad4cd996134e705723ff77"

[[durable_objects.bindings]]
name = "STATE_DO"
class_name = "StateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StateDO"]
