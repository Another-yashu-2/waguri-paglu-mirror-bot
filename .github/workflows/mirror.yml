name: Cloud Mirror Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Task Job ID'
        required: true
      job_mode:
        description: 'Execution Mode (mirror or ytdl_probe)'
        required: false
        default: 'mirror'

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Runner Scripts
        uses: actions/checkout@v4

      - name: Cache yt-dlp Runtime Packages
        if: inputs.job_mode == 'ytdl_probe'
        uses: actions/cache@v4
        with:
          path: /tmp/ytdl_pkgs
          key: ytdl-pkgs-${{ runner.os }}-v1

      - name: Install Transfer & Archive Tools
        if: inputs.job_mode != 'ytdl_probe'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aria2 ffmpeg p7zip-full unzip tar curl jq
          if curl -fsSL --retry 2 "https://downloads.rclone.org/rclone-current-linux-amd64.zip" -o /tmp/rclone.zip; then
            unzip -q -j /tmp/rclone.zip "*/rclone" -d /tmp/rclone_bin
            sudo install -m 0755 /tmp/rclone_bin/rclone /usr/local/bin/rclone
            rm -rf /tmp/rclone.zip /tmp/rclone_bin
          else
            sudo apt-get install -y -qq rclone
          fi

      - name: Execute Mirror Job
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          JOB_MODE: ${{ inputs.job_mode || 'mirror' }}
          WORKER_URL: https://telegram-gdrive-bot.yashdaive.workers.dev
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          YTDL_COOKIES: ${{ secrets.YTDL_COOKIES }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 runner/mirror_runner.py
